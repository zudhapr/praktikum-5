services:
  app:
    build: .
    ports:
      - "8000:5000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks: [lms_net]

  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [lms_net]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 54
    networks: [lms_net]

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-${POSTGRES_PASSWORD}}"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [lms_net]
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  lms_net:
